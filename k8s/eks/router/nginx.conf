map "$cookie_cohort:$arg_user" $cohort {
    default CONTROL;

    ~*^CANARY: CANARY;
    ~*^CONTROL: CONTROL;

    ":user10" CANARY;
}

map $cohort $frontend_upstream {
    CONTROL frontend_stable;
    CANARY  frontend_canary;
}

upstream frontend_stable {
    server frontend-stable-service.default.svc.cluster.local:80;
}

upstream frontend_canary {
    server frontend-canary-service.default.svc.cluster.local:80;
}

upstream backend {
    server backend-service.default.svc.cluster.local:8080;
}

server {
    listen 80;
    server_name _;

    add_header X-Canary-Cohort $cohort always;
    add_header Set-Cookie "cohort=$cohort; Path=/; SameSite=Lax; HttpOnly" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
