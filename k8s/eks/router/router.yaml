apiVersion: apps/v1
kind: Deployment
metadata:
  name: cohort-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cohort-router
  template:
    metadata:
      labels:
        app: cohort-router
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: cohort-router-config

---
apiVersion: v1
kind: Service
metadata:
  name: cohort-router-service
spec:
  selector:
    app: cohort-router
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
