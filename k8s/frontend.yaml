# Stable frontend V1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-stable
  template:
    metadata:
      labels:
        app: frontend-stable
    spec:
      containers:
        - name: frontend
          image: canary-shop-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
# Stable frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-stable-service
spec:
  selector:
    app: frontend-stable
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# Canary frontend V2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-canary
  template:
    metadata:
      labels:
        app: frontend-canary
    spec:
      containers:
        - name: frontend
          image: canary-shop-frontend:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---
# Canary frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary-service
spec:
  selector:
    app: frontend-canary
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
