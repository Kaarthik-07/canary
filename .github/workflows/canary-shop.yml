name: Canary Shop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # -----------------------------------------------
  # JOB 1: Validate frontend and backend
  # -----------------------------------------------
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend tests
        working-directory: backend
        env:
          JWT_SECRET: 'canary-shop-ci-test-secret-32-bytes-minimum'
        run: chmod +x mvnw && ./mvnw test

  # -----------------------------------------------
  # JOB 2: Build and publish Docker images to ECR
  # -----------------------------------------------
  publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${REGISTRY}/canary-frontend:${IMAGE_TAG}" ./frontend
          docker push "${REGISTRY}/canary-frontend:${IMAGE_TAG}"

      - name: Build and push backend
        env:
          REGISTRY: ${{ vars.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${REGISTRY}/canary-backend:${IMAGE_TAG}" ./backend
          docker push "${REGISTRY}/canary-backend:${IMAGE_TAG}"

  # -----------------------------------------------
  # JOB 3: Deploy images to Amazon EKS
  # -----------------------------------------------
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 20

    concurrency:
      group: canary-shop-eks-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      # Authenticate GitHub Actions with AWS
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Install kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.37.0'

      # -----------------------------------------------
      # TEMPORARILY ALLOW GITHUB RUNNER TO REACH EKS
      # -----------------------------------------------
      - name: Temporarily allow GitHub runner IP
        id: allowlist
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')

          echo "GitHub runner public IP: ${RUNNER_IP}"

          VPC_CONFIG=$(aws eks describe-cluster \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}" \
            --query 'cluster.resourcesVpcConfig' \
            --output json)

          ORIGINAL_VPC=$(jq -c \
            '{endpointPublicAccess, endpointPrivateAccess, publicAccessCidrs}' \
            <<< "$VPC_CONFIG")

          # Save the original configuration for cleanup.
          echo "original_vpc=${ORIGINAL_VPC}" >> "$GITHUB_OUTPUT"

          # Add the runner IP without removing existing CIDRs.
          jq --arg cidr "${RUNNER_IP}/32" \
            '.publicAccessCidrs = ((.publicAccessCidrs + [$cidr]) | unique)' \
            <<< "$ORIGINAL_VPC" > /tmp/eks-vpc-config.json

          aws eks update-cluster-config \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}" \
            --resources-vpc-config file:///tmp/eks-vpc-config.json

          aws eks wait cluster-active \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}"

          echo "GitHub runner IP is now allowed."

      # -----------------------------------------------
      # CONFIGURE KUBERNETES ACCESS
      # -----------------------------------------------
      - name: Configure EKS access
        id: eks-access
        run: |
          aws eks update-kubeconfig \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}"

      # -----------------------------------------------
      # DEPLOY BACKEND
      # -----------------------------------------------
      - name: Update backend image
        id: set-backend-image
        run: |
          kubectl set image deployment/backend \
            backend=${{ vars.ECR_REGISTRY }}/canary-backend:${{ github.sha }} \
            -n default

      - name: Verify backend rollout
        id: deploy-backend
        run: |
          kubectl rollout status deployment/backend \
            -n default \
            --timeout=300s

      # -----------------------------------------------
      # DEPLOY CANARY FRONTEND
      # -----------------------------------------------
      - name: Update canary frontend image
        id: set-frontend-image
        run: |
          kubectl set image deployment/frontend-canary \
            frontend=${{ vars.ECR_REGISTRY }}/canary-frontend:${{ github.sha }} \
            -n default

      - name: Verify frontend rollout
        id: deploy-frontend
        run: |
          kubectl rollout status deployment/frontend-canary \
            -n default \
            --timeout=180s
      # -----------------------------------------------
      # APPLICATION SMOKE TESTS THROUGH AWS ALB
      # -----------------------------------------------
      - name: Verify application through ALB
        env:
          ALB_URL: http://k8s-default-canarysh-775063b19d-262848391.ap-southeast-2.elb.amazonaws.com
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing application homepage..."
          curl --retry 5 --retry-delay 5 --retry-all-errors \
            --fail --silent --show-error \
            "${ALB_URL}/" -o /dev/null

          echo "Testing products API..."
          curl --retry 5 --retry-delay 5 --retry-all-errors \
            --fail --silent --show-error \
            "${ALB_URL}/api/products" -o /tmp/products.json

          test -s /tmp/products.json
          echo "Products API returned a non-empty response."

          check_cohort() {
            local user="$1"
            local expected="$2"
            local headers
            headers=$(mktemp)

            echo "Checking ${user}: expected ${expected}..."

            if ! curl --retry 5 --retry-delay 5 --retry-all-errors \
              --fail --silent --show-error \
              -D "$headers" -o /dev/null \
              "${ALB_URL}/?user=${user}"; then
              rm -f "$headers"
              return 1
            fi

            if ! grep -qi "^X-Canary-Cohort: ${expected}" "$headers"; then
              echo "ERROR: Expected ${expected} cohort for ${user}."
              cat "$headers"
              rm -f "$headers"
              return 1
            fi

            echo "${user} correctly routed to ${expected}."
            rm -f "$headers"
          }

          check_cohort user1 CONTROL
          check_cohort user10 CANARY

          echo "All ALB smoke tests passed."
      # -----------------------------------------------
      # VERIFY DEPLOYMENT STATUS
      # -----------------------------------------------
      - name: Verify deployments
        run: |
          kubectl get deployments -n default -o wide
          kubectl get pods -n default -o wide
          kubectl get services -n default

      # -----------------------------------------------
      # AUTOMATIC ROLLBACK
      # -----------------------------------------------
      - name: Roll back failed deployment
        if: ${{ failure() && steps.eks-access.outcome == 'success' }}
        env:
          BACKEND_UPDATED: ${{ steps.set-backend-image.outcome }}
          FRONTEND_UPDATED: ${{ steps.set-frontend-image.outcome }}
        shell: bash
        run: |
          set -uo pipefail

          rollback_failed=0

          rollback_deployment() {
            local deployment="$1"

            echo "Rolling back deployment/${deployment}..."

            if ! kubectl rollout undo deployment/"${deployment}" -n default; then
              echo "ERROR: Could not initiate rollback for ${deployment}"
              rollback_failed=1
              return
            fi

            if ! kubectl rollout status deployment/"${deployment}" \
              -n default --timeout=300s; then
              echo "ERROR: Rollback did not complete for ${deployment}"
              rollback_failed=1
            else
              echo "Successfully rolled back ${deployment}."
            fi
          }

          # Roll back only deployments whose image was updated.
          if [[ "$BACKEND_UPDATED" == "success" ]]; then
            rollback_deployment backend
          fi

          if [[ "$FRONTEND_UPDATED" == "success" ]]; then
            rollback_deployment frontend-canary
          fi

          echo "Deployment state after rollback:"
          kubectl get deployments -n default -o wide || rollback_failed=1

          exit "$rollback_failed"

      # -----------------------------------------------
      # RESTORE ORIGINAL EKS ACCESS CONFIGURATION
      # -----------------------------------------------
      - name: Restore original EKS public access CIDRs
        if: always() && steps.allowlist.outputs.original_vpc != ''
        env:
          ORIGINAL_VPC: ${{ steps.allowlist.outputs.original_vpc }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ORIGINAL_VPC" > /tmp/eks-original-vpc.json

          aws eks update-cluster-config \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}" \
            --resources-vpc-config file:///tmp/eks-original-vpc.json

          aws eks wait cluster-active \
            --name canary-shop-eks \
            --region "${{ vars.AWS_REGION }}"

          echo "Original EKS public access CIDRs restored."
