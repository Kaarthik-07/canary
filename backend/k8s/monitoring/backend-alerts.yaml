
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: canary-shop-backend-alerts
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: canary-shop.backend
      interval: 30s
      rules:

        # Backend availability
        - alert: BackendDown
          expr: up{service="backend-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Canary Shop backend is down"
            description: "Backend target has been unavailable for more than 1 minute."

        # High request latency
        - alert: BackendHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{service="backend-service"}[5m])
              )
            ) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Backend p95 latency is high"
            description: "95th percentile request latency has exceeded 500ms for 2 minutes."

        # High backend CPU
        - alert: BackendHighCPU
          expr: |
            rate(process_cpu_usage{service="backend-service"}[5m]) > 0.8
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Backend CPU usage is high"
            description: "Backend process CPU usage has exceeded 80% for 3 minutes."

        # Pod restart detection
        - alert: BackendPodRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="default",
              container="backend"
            }[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Backend container restarted"
            description: "A backend container has restarted within the last 10 minutes."
