apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: backend-servicemonitor
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: backend

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
